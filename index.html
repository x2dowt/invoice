<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skating Coaching Invoice Generator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2pdf Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; }
      #invoice { shadow: none !important; border: none !important; padding: 0 !important; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans p-4 md:p-8">

  <div class="max-w-5xl mx-auto">
    <!-- Top Action Bar -->
    <div class="no-print mb-6 flex justify-between items-center bg-white p-4 rounded-lg shadow-sm border border-gray-200">
      <div>
        <h1 class="text-xl font-bold text-gray-800">Skating Coaching Invoice Generator</h1>
        <p class="text-xs text-gray-500">Customizable invoice with manual due date & dynamic PDF export.</p>
      </div>
      <div class="flex gap-2">
        <button onclick="window.print()" class="bg-gray-600 hover:bg-gray-700 text-white font-semibold px-4 py-2 rounded-md shadow transition text-sm">
          Print / Save PDF
        </button>
        <button onclick="downloadPDF()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2 rounded-md shadow transition text-sm">
          Download PDF
        </button>
      </div>
    </div>

    <!-- Printable Invoice Container -->
    <div id="invoice" class="bg-white p-8 md:p-12 rounded-lg shadow-md border border-gray-200">
      
      <!-- Header -->
      <div class="flex justify-between items-start border-b pb-6 mb-6">
        <div class="w-2/3">
          <input type="text" value="COACH NAME / SKATING ACADEMY" class="font-bold text-2xl text-gray-900 outline-none w-full mb-1 bg-transparent">
          <input type="text" value="Figure Skating Coach & Instructor" class="text-sm text-gray-500 outline-none w-full bg-transparent">
          <input type="text" value="Email: coach@example.com | Phone: (123) 456-7890" class="text-xs text-gray-400 outline-none w-full mt-1 bg-transparent">
        </div>
        <div class="text-right w-1/3">
          <h2 class="text-3xl font-extrabold text-blue-600 uppercase tracking-wide">INVOICE</h2>
          <div class="mt-2 text-sm text-gray-600">
            <label class="block">Invoice #: <input type="text" id="invoice-num" value="INV-2026-001" class="font-semibold text-gray-800 text-right outline-none w-28 bg-transparent"></label>
            <label class="block">Date: <input type="date" id="invoice-date" class="font-semibold text-gray-800 text-right outline-none bg-transparent"></label>
          </div>
        </div>
      </div>

      <!-- Bill To & Payment Terms -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8 text-sm">
        <div>
          <h3 class="font-bold text-gray-700 uppercase tracking-wider text-xs mb-2">Billed To:</h3>
          <input type="text" id="billed-to-name" placeholder="Parent or Skater Name" class="font-semibold text-gray-900 border-b border-gray-300 focus:border-blue-500 outline-none w-full mb-1 p-1 bg-transparent">
          <input type="text" id="billed-to-club" placeholder="Arena / Club Name" class="text-gray-600 border-b border-gray-200 focus:border-blue-500 outline-none w-full p-1 bg-transparent">
        </div>
        <div class="text-right">
          <h3 class="font-bold text-gray-700 uppercase tracking-wider text-xs mb-2">Payment Details:</h3>
          <input type="text" value="e-Transfer to: coach@example.com" class="text-xs text-gray-600 text-right outline-none w-full bg-transparent">
          <div class="flex items-center justify-end gap-1 mt-1">
            <span class="text-xs font-semibold text-red-600">Due:</span>
            <input type="text" value="10 days after invoice date" class="text-xs font-semibold text-red-600 text-right border-b border-transparent hover:border-red-300 focus:border-red-500 outline-none w-48 bg-transparent">
          </div>
        </div>
      </div>

      <!-- Line Items Table -->
      <table class="w-full text-left mb-6 border-collapse">
        <thead>
          <tr class="border-b-2 border-gray-300 text-xs font-bold uppercase text-gray-600 bg-gray-50">
            <th class="py-3 px-2">Skater</th>
            <th class="py-3 px-2 w-28">Date(s)</th>
            <th class="py-3 px-2">Description</th>
            <th class="py-3 px-2 text-center w-16">Qty</th>
            <th class="py-3 px-2 text-right w-24">Unit price</th>
            <th class="py-3 px-2 text-right w-24">Total price</th>
            <th class="py-3 px-2 text-center no-print w-10"></th>
          </tr>
        </thead>
        <tbody id="line-items">
          <!-- Dynamic Rows -->
        </tbody>
      </table>

      <!-- Quick Add Control Bar (Hidden when Printing) -->
      <div class="no-print bg-gray-50 p-4 rounded-lg border border-gray-200 mb-8">
        <div class="font-bold text-xs uppercase tracking-wider text-gray-600 mb-3">Quick Add New Lesson Row:</div>
        <div class="grid grid-cols-2 md:grid-cols-6 gap-2 text-xs">
          <input type="text" id="add-skater" placeholder="Skater Name" class="p-1.5 border rounded">
          <input type="text" id="add-date" placeholder="Date (e.g. Sept 12)" class="p-1.5 border rounded">
          <select id="add-type" onchange="autoFillRate()" class="p-1.5 border rounded bg-white">
            <option value="Private (15 x $7.50)">Private (15 min - $7.50)</option>
            <option value="Semi-Private (15 - $4.00)">Semi-Private (15 min - $4.00)</option>
            <option value="Private (10 x $5.00)">Private (10 min - $5.00)</option>
            <option value="Jumpstart (45 min)">Jumpstart (45 min)</option>
            <option value="CanSkate (45 min)">CanSkate (45 min)</option>
            <option value="Custom">Custom Lesson</option>
          </select>
          <input type="number" id="add-qty" value="1" placeholder="Qty" class="p-1.5 border rounded text-center">
          <input type="number" step="0.01" id="add-price" value="7.50" placeholder="Price" class="p-1.5 border rounded text-right">
          <button onclick="addCustomRow()" class="bg-gray-800 hover:bg-black text-white font-semibold rounded py-1.5 transition">
            + Add Row
          </button>
        </div>
      </div>

      <!-- Totals Summary -->
      <div class="flex justify-end border-t border-gray-200 pt-4">
        <div class="w-64 space-y-2 text-sm">
          <div class="flex justify-between text-gray-800 text-xl font-bold border-t pt-2 border-gray-300">
            <span>Total price:</span>
            <span id="grand-total" class="text-blue-600">$0.00</span>
          </div>
        </div>
      </div>

      <!-- Footer Notes -->
      <div class="mt-12 pt-6 border-t border-gray-100 text-center text-sm text-gray-600">
        <p>Thank you</p>
      </div>

    </div>
  </div>

  <script>
    document.getElementById('invoice-date').valueAsDate = new Date();

    function autoFillRate() {
      const type = document.getElementById('add-type').value;
      const priceInput = document.getElementById('add-price');
      
      if (type.includes('$7.50')) priceInput.value = '7.50';
      else if (type.includes('$4.00')) priceInput.value = '4.00';
      else if (type.includes('$5.00')) priceInput.value = '5.00';
      else priceInput.value = '0.00';
    }

    function calculateTotals() {
      const rows = document.querySelectorAll('#line-items tr');
      let grandTotal = 0;

      rows.forEach(row => {
        const qtyInput = row.querySelector('.item-qty');
        const priceInput = row.querySelector('.item-price');
        const totalCell = row.querySelector('.item-total');

        if (qtyInput && priceInput && totalCell) {
          const qty = parseFloat(qtyInput.value) || 0;
          const price = parseFloat(priceInput.value) || 0;
          const total = qty * price;

          grandTotal += total;
          totalCell.innerText = `$${total.toFixed(2)}`;
        }
      });

      document.getElementById('grand-total').innerText = `$${grandTotal.toFixed(2)}`;
    }

    function addCustomRow() {
      const skater = document.getElementById('add-skater').value.trim() || '';
      const date = document.getElementById('add-date').value.trim() || '';
      const desc = document.getElementById('add-type').value;
      const qty = parseFloat(document.getElementById('add-qty').value) || 1;
      const price = parseFloat(document.getElementById('add-price').value) || 0;

      const tbody = document.getElementById('line-items');
      const tr = document.createElement('tr');
      tr.className = "border-b border-gray-100 text-sm hover:bg-gray-50";
      tr.innerHTML = `
        <td class="py-2 px-2"><input type="text" value="${skater}" placeholder="Skater" class="item-skater w-full outline-none bg-transparent"></td>
        <td class="py-2 px-2"><input type="text" value="${date}" placeholder="Date" class="item-date w-full outline-none bg-transparent"></td>
        <td class="py-2 px-2"><input type="text" value="${desc}" class="item-desc w-full outline-none bg-transparent"></td>
        <td class="py-2 px-2 text-center"><input type="number" value="${qty}" oninput="calculateTotals()" class="item-qty w-12 text-center outline-none bg-transparent"></td>
        <td class="py-2 px-2 text-right">$<input type="number" step="0.01" value="${price.toFixed(2)}" oninput="calculateTotals()" class="item-price w-16 text-right outline-none bg-transparent"></td>
        <td class="py-2 px-2 text-right font-semibold item-total">$${(qty * price).toFixed(2)}</td>
        <td class="py-2 px-2 text-center no-print"><button onclick="removeRow(this)" class="text-red-400 hover:text-red-600 font-bold">×</button></td>
      `;

      tbody.appendChild(tr);

      // Clear inputs for next entry
      document.getElementById('add-skater').value = '';
      document.getElementById('add-date').value = '';

      calculateTotals();
    }

    function removeRow(btn) {
      btn.closest('tr').remove();
      calculateTotals();
    }

    function downloadPDF() {
      const element = document.getElementById('invoice');
      
      const dateVal = document.getElementById('invoice-date').value;
      let monthName = "Invoice";
      if (dateVal) {
        const parts = dateVal.split('-');
        if (parts.length === 3) {
          const d = new Date(parts[0], parts[1] - 1, parts[2]);
          monthName = d.toLocaleString('default', { month: 'long' });
        }
      }

      const skaterOrClient = document.getElementById('billed-to-name').value.trim() || 'Client';
      const club = document.getElementById('billed-to-club').value.trim() || '';

      let rawFilename = `${monthName}_${skaterOrClient}${club ? '_' + club : ''}_Invoice`;
      let cleanFilename = rawFilename.replace(/[^a-zA-Z0-9_-]/g, '_') + '.pdf';

      const opt = {
        margin:       0.3,
        filename:     cleanFilename,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, logging: false },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
      };

      if (typeof html2pdf !== 'undefined') {
        html2pdf().set(opt).from(element).save().catch(err => {
          console.error("html2pdf failed, falling back to print dialog:", err);
          window.print();
        });
      } else {
        window.print();
      }
    }

    calculateTotals();
  </script>
</body>
</html>
